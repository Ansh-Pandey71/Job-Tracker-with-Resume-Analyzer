<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>JobLens — Register</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Sora:wght@600;700&display=swap" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0d0f14; --card: #1a1d26; --border: #252836;
      --accent: #5c6ef8; --accent-2: #7b5cf8; --text: #e8eaf2; --muted: #7a7f99;
      --input-bg: #0f1117; --error: #f87171; --success: #4ade80; --radius: 14px;
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); min-height: 100vh; position: relative; overflow: hidden; }
    body::before, body::after { content: ''; position: fixed; border-radius: 50%; filter: blur(90px); z-index: 0; pointer-events: none; }
    body::before { width: 500px; height: 500px; background: radial-gradient(circle, rgba(123,92,248,0.16) 0%, transparent 70%); top: -80px; right: -100px; }
    body::after  { width: 400px; height: 400px; background: radial-gradient(circle, rgba(92,110,248,0.14) 0%, transparent 70%); bottom: -80px; left: -80px; }
    .wrapper { position: relative; z-index: 1; }
    .logo-icon { width: 38px; height: 38px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-radius: 10px; display: flex; align-items: center; justify-content: center; }
    .logo-icon svg { width: 20px; height: 20px; fill: #fff; }
    .logo-text { font-family: 'Sora', sans-serif; font-size: 1.4rem; font-weight: 700; color: var(--text); letter-spacing: -0.02em; }
    .logo-text span { color: var(--accent); }
    .jl-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 2.2rem 2rem; box-shadow: 0 24px 64px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.03); }
    .card-title { font-family: 'Sora', sans-serif; font-size: 1.5rem; font-weight: 700; color: var(--text); letter-spacing: -0.02em; }
    .card-sub { font-size: 0.875rem; color: var(--muted); }
    .form-label { font-size: 0.8rem; font-weight: 500; color: var(--muted); letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 0.45rem; }
    .form-control { background: var(--input-bg) !important; border: 1px solid var(--border) !important; border-radius: var(--radius) !important; padding: 0.75rem 1rem !important; font-size: 0.9rem !important; font-family: 'DM Sans', sans-serif !important; color: var(--text) !important; }
    .form-control::placeholder { color: #3e4258 !important; }
    .form-control:focus { border-color: var(--accent) !important; box-shadow: 0 0 0 3px rgba(92,110,248,0.15) !important; }
    .invalid-feedback { font-size: 0.8rem; color: var(--error); }
    .strength-bar { height: 3px; border-radius: 99px; background: var(--border); margin-top: 0.5rem; overflow: hidden; }
    .strength-fill { height: 100%; border-radius: 99px; width: 0%; transition: width 0.3s, background 0.3s; }
    .password-hint { font-size: 0.75rem; color: var(--muted); margin-top: 0.35rem; }
    .btn-primary-jl { width: 100%; padding: 0.8rem; background: linear-gradient(135deg, var(--accent), var(--accent-2)); border: none; border-radius: var(--radius); color: #fff; font-family: 'DM Sans', sans-serif; font-size: 0.95rem; font-weight: 600; letter-spacing: 0.01em; transition: opacity 0.2s, transform 0.15s; }
    .btn-primary-jl:hover { opacity: 0.88; transform: translateY(-1px); }
    .btn-primary-jl:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .jl-divider { display: flex; align-items: center; gap: 0.75rem; color: var(--muted); font-size: 0.78rem; }
    .jl-divider::before, .jl-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .footer-link { font-size: 0.875rem; color: var(--muted); }
    .footer-link a { color: var(--accent); text-decoration: none; font-weight: 500; transition: opacity 0.2s; }
    .footer-link a:hover { opacity: 0.75; text-decoration: underline; }
    .api-error { font-size: 0.85rem; color: var(--error); background: rgba(248,113,113,0.08); border: 1px solid rgba(248,113,113,0.2); border-radius: 10px; padding: 0.6rem 0.9rem; display: none; margin-bottom: 1rem; }
    .api-error.show { display: block; }
    .success-toast { position: fixed; top: 1.5rem; right: 1.5rem; background: #1a2e1e; border: 1px solid var(--success); color: var(--success); border-radius: 10px; padding: 0.75rem 1.2rem; font-size: 0.875rem; font-weight: 500; opacity: 0; transform: translateY(-10px); transition: all 0.35s; z-index: 999; }
    .success-toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>
  <div class="wrapper d-flex align-items-center justify-content-center min-vh-100 px-3">
    <div style="width:100%;max-width:420px">
      <div class="text-center mb-4">
        <div class="d-inline-flex align-items-center gap-2">
          <div class="logo-icon">
            <svg viewBox="0 0 24 24"><path d="M20 6h-4V4c0-1.1-.9-2-2-2h-4c-1.1 0-2 .9-2 2v2H4c-1.1 0-2 .9-2 2v11c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10-2h4v2h-4V4zm10 15H4V8h16v11z"/></svg>
          </div>
          <span class="logo-text">Job<span>Lens</span></span>
        </div>
      </div>
      <div class="jl-card">
        <div class="card-title mb-1">Create account</div>
        <div class="card-sub mb-4">Start tracking your career journey today</div>
        <div class="api-error" id="api-error"></div>
        <form id="registerForm" novalidate>
          <div class="mb-3">
            <label for="email" class="form-label">Email address</label>
            <input type="email" class="form-control" id="email" placeholder="you@example.com" autocomplete="email" required/>
            <div class="invalid-feedback">Please enter a valid email address.</div>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" placeholder="Min. 6 characters" autocomplete="new-password" required minlength="6" oninput="checkStrength(this.value)"/>
            <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
            <div class="password-hint" id="strength-label">Enter a password</div>
            <div class="invalid-feedback">Password must be at least 6 characters.</div>
          </div>
          <div class="mb-3">
            <label for="confirm" class="form-label">Confirm password</label>
            <input type="password" class="form-control" id="confirm" placeholder="Repeat your password" autocomplete="new-password" required/>
            <div class="invalid-feedback">Passwords do not match.</div>
          </div>
          <button type="submit" class="btn-primary-jl mt-1" id="submit-btn">Create Account</button>
        </form>
        <div class="jl-divider my-4">or</div>
        <div class="footer-link text-center">Already have an account? <a href="/login">Sign in</a></div>
      </div>
    </div>
  </div>
  <div class="success-toast" id="toast">Account created! Redirecting…</div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    if (localStorage.getItem('jl_token')) window.location.href = '/dashboard';

    function checkStrength(val) {
      const fill = document.getElementById('strength-fill');
      const label = document.getElementById('strength-label');
      let score = 0;
      if (val.length >= 6)          score++;
      if (val.length >= 10)         score++;
      if (/[A-Z]/.test(val))        score++;
      if (/[0-9]/.test(val))        score++;
      if (/[^A-Za-z0-9]/.test(val)) score++;
      const levels = [
        { w: '0%',   bg: 'transparent', t: 'Enter a password' },
        { w: '25%',  bg: '#f87171',     t: 'Weak'   },
        { w: '50%',  bg: '#fb923c',     t: 'Fair'   },
        { w: '75%',  bg: '#facc15',     t: 'Good'   },
        { w: '100%', bg: '#4ade80',     t: 'Strong' },
      ];
      const l = val.length === 0 ? levels[0] : levels[Math.min(score, 4)];
      fill.style.width      = l.w;
      fill.style.background = l.bg;
      label.textContent     = l.t;
    }

    document.getElementById('confirm').addEventListener('input', function() {
      this.setCustomValidity(document.getElementById('password').value !== this.value ? 'mismatch' : '');
    });

    document.getElementById('registerForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const confirm = document.getElementById('confirm');
      confirm.setCustomValidity(document.getElementById('password').value !== confirm.value ? 'mismatch' : '');
      this.classList.add('was-validated');
      if (!this.checkValidity()) return;

      const btn   = document.getElementById('submit-btn');
      const errEl = document.getElementById('api-error');
      btn.disabled = true;
      btn.textContent = 'Creating…';
      errEl.classList.remove('show');

      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email:    document.getElementById('email').value.trim(),
            password: document.getElementById('password').value
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Registration failed');

        localStorage.setItem('jl_token', data.token);
        localStorage.setItem('jl_email', data.email);
        document.getElementById('toast').classList.add('show');
        setTimeout(() => window.location.href = '/dashboard', 1500);
      } catch(err) {
        errEl.textContent = err.message;
        errEl.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>
